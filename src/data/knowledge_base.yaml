# plat-costmodel Knowledge Base
# Source: domain-interview cost knowledge base (Day 1 seed data)
# Date: 2026-03-22
# This is the Day 1 seed data — the estimator works from this before any Yardi actuals are ingested.

scope_levels:
  light:
    description: "Light cosmetic turn — paint, clean, patch, hardware, carpet"
    total_range:
      low: 3000
      high: 5000
    line_items:
      paint:
        low: 400
        high: 600
        notes: "Touch-up or single coat, may be in-house"
      cleaning:
        low: 300
        high: 500
        notes: "Deep clean, carpet clean"
      patch_repair:
        low: 500
        high: 1000
        notes: "Drywall patches, minor fixes"
      hardware:
        low: 200
        high: 400
        notes: "New cabinet/door hardware, outlet covers"
      carpet:
        low: 500
        high: 1000
        notes: "Replace carpet in bedrooms if needed"
      contingency_pct: 10

  standard_value_add:
    description: "Full value-add turn — LVP, kitchen update, bath update, paint, appliances, fixtures"
    total_range:
      low: 12000
      high: 18000
    size_scaling:
      small:
        max_sqft: 700
        low: 12000
        high: 14000
      medium:
        min_sqft: 700
        max_sqft: 950
        low: 14000
        high: 16000
      large:
        min_sqft: 950
        low: 16000
        high: 18000
    line_items:
      flooring:
        low: 1500
        high: 2500
        notes: "LVP in kitchen/living/bath. Carpet in bedrooms optional (reduces cost). Subfloor repair pushes to top of range."
        material: "LVP (luxury vinyl plank)"
        variance_drivers:
          - "Unit square footage (primary driver)"
          - "Carpet in bedrooms vs LVP throughout"
          - "Subfloor repair needed"
      kitchen:
        low: 1500
        high: 2500
        notes: "Paint existing cabinets, new hardware, butcher block or basic granite countertops. Replace cabinets only if water-damaged or structurally broken."
        material: "Butcher block or basic granite counters"
        variance_drivers:
          - "Finish tier (basic vs upgraded)"
          - "Cabinet condition (paint vs replace)"
          - "Backsplash included in upgraded tier"
      bathroom:
        low: 2000
        high: 3500
        per: "bathroom"
        notes: "New vanity/mirror, tub resurfacing or new surround, new fixtures, LVP flooring continuous from rest of unit. Toilet replaced if needed."
        material: "Standard vanity, acrylic tub surround or refinish"
        variance_drivers:
          - "Tub resurface vs new surround"
          - "Toilet replacement needed"
          - "Tile vs LVP floor"
      paint:
        low: 800
        high: 1200
        notes: "Subbed out, standard 2-coat interior, whole unit."
        variance_drivers:
          - "Unit square footage"
          - "Wall repair/texture work needed"
      appliances:
        low: 1500
        high: 2500
        notes: "Full package: fridge, stove, dishwasher, microwave. New basic black or stainless."
        material: "Basic black or stainless steel"
        variance_drivers:
          - "Black vs stainless (stainless is higher)"
          - "Include W/D connections adds cost"
      fixtures_doors_trim:
        low: 500
        high: 1000
        notes: "New light fixtures, outlet/switch covers, door hardware. Replace doors only if damaged."
        variance_drivers:
          - "Number of fixtures to replace"
          - "Door replacement needed vs hardware only"
    contingency_pct:
      low: 10
      high: 15

finish_tiers:
  basic:
    description: "Standard finishes — gets the job done, clean and modern"
    adjustments:
      kitchen: "Laminate or basic butcher block counters, painted cabinets, basic hardware"
      bathroom: "Standard vanity, basic fixtures"
      flooring: "Standard grade LVP, carpet in bedrooms"
      appliances: "Basic black"
  upgraded:
    description: "Nicer finishes — backsplash, better hardware, upgraded counters"
    adjustments:
      kitchen: "Granite counters, tile backsplash, upgraded hardware"
      bathroom: "Upgraded vanity, better fixtures"
      flooring: "Upgraded LVP throughout (no carpet)"
      appliances: "Stainless steel"

exterior_capex:
