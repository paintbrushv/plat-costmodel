    high: 10000
    notes: "Range driven by level of deferred maintenance"
  condition_signals:
    - "Visual condition (what you can see — peeling paint, roof patches, lot cracks)"
    - "Age/class (what you can predict — older buildings need more)"
  items:
    roof:
      per_unit_low: 1000
      per_unit_high: 1500
      cycle_years: "20-25"
      estimation_inputs: "roof type + age + building footprint"
    parking:
      per_unit_low: 500
      per_unit_high: 1500
      cycle_years: "Reseal 3-5yr, full resurface 15-20yr"
    hvac:
      per_unit_low: 3000
      per_unit_high: 5000
      cycle_years: "15-20"
    siding_paint:
      per_unit_low: 1000
      per_unit_high: 2000
      cycle_years: "7-15 depending on material"
    fencing_gates:
      per_unit_low: 300
      per_unit_high: 800
      cycle_years: "As needed"
    landscaping:
      per_unit_low: 200
      per_unit_high: 500
      cycle_years: "Major rehab at acquisition"
    signage_lighting:
      per_unit_low: 100
      per_unit_high: 300
      cycle_years: "At acquisition"
  bundles:
    envelope_refresh:
      includes: [siding_paint, signage_lighting, landscaping]
      class_shift_to: "B"
    full_envelope:
      includes: [roof, siding_paint, signage_lighting, landscaping, fencing_gates]
      class_shift_to: "B+"
  annual_reserves:
    class_b:
      low: 250
      high: 450
    class_c:
      low: 600
      high: 800

